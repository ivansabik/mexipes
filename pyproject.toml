[project]
name = "mexipes"
version = "0.1.0"
description = "AI-assisted pipeline that turns Spanish cookbook PDFs into structured English recipes for computational gastronomy, search, and recipe suggestion"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = [
    "recipes",
    "mexican-cuisine",
    "pdf",
    "llm",
    "litellm",
    "computational-gastronomy",
    "localization",
    "cli",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "instructor==1.17.0",
    "jinja2==3.1.6",
    "langgraph==1.2.19",
    "litellm==1.106.6",
    "pillow==13.0.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "pymupdf==1.28.2",
    "python-dotenv==1.2.4",
    "typer==0.27.3",
]

[project.optional-dependencies]
dev = [
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[project.urls]
Homepage = "https://github.com/ivansabik/mexipes"
Repository = "https://github.com/ivansabik/mexipes"

[project.scripts]
mexipes = "mexipes.cli:app"

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
